<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poker Coach">
<title>Poker Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="backBtn" class="icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <div id="blinds" class="blinds"></div>
    <div class="top-right"><button id="unitBtn" class="unit-btn"></button>
    <button id="gearBtn" class="icon-btn gear" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="21" height="21"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button></div>
  </header>

  <section id="seats"></section>

  <section class="board-wrap">
    <div id="board" class="board"></div>
    <div class="pot-row"><span id="status" class="status"></span><span id="pot" class="pot"></span></div>
  </section>

  <section class="hero-bet-row"><span id="heroBet" class="bet-chip"></span><div id="quick" class="quick"></div></section>

  <section id="actions" class="actions"></section>

  <section class="hero-row">
    <div id="heroCards" class="hero-cards"></div>
    <div id="heroBox" class="hero-box">
      <div id="heroHand" class="hero-hand"></div>
      <div id="heroPos" class="pos hero-pos"></div>
      <div id="heroStack" class="hero-stack"></div>
    </div>
  </section>
</div>

<div id="menu" class="menu">
  <div class="menu-inner">
    <div class="menu-name">Poker Coach</div>
    <div class="menu-row menu-tools"><button id="menuLibrary" class="btn">Library</button><button id="menuLab" class="btn">Lab</button><button id="menuReview" class="btn">Review</button><button id="menuReport" class="btn">Report</button><button id="menuExport" class="btn">Export</button></div>
    <button id="modeCash" class="mode">
      <span class="mode-title">6-Max Cash</span>
      <span id="modeSub" class="mode-sub"></span>
      <svg class="mode-go" viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <button id="modeDrills" class="mode mode-sm">
      <span class="mode-title">Drills</span>
      <span id="drillSub" class="mode-sub">Preflop spots from your leaks</span>
      <svg class="mode-go" viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <div class="menu-row"><button id="menuHands" class="btn">Hands</button><button id="menuLeaks" class="btn">Leaks</button><button id="menuSettings" class="btn">Settings</button><button id="menuProgress" class="btn">Progress</button></div>
    <button id="menuAnalysis" class="btn wide menu-analysis">Analysis</button>
    <div id="menuTrend" class="pg-mini"></div>
  </div>
</div>

<div id="panel" class="panel">
  <div class="panel-head"><button id="panelBack" class="icon-btn" aria-label="Back" hidden><svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button><button id="panelClose" class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><span id="panelTitle"></span><span id="panelAside"></span></div>
  <div id="panelBody" class="panel-body"></div>
</div>

<div id="sheetBg" class="sheet-bg"></div>
<div id="raiseSheet" class="sheet">
  <div class="grab"></div>
  <div class="raise-top"><button class="step" data-d="-1">−</button><div class="raise-amt"><span id="raiseVal"></span><small id="raiseUnit"></small><div id="raisePct" class="raise-pct"></div></div><button class="step" data-d="1">+</button></div>
  <div id="presets" class="presets"></div>
  <input id="raiseSlider" type="range" min="0" max="1000" step="1">
  <button id="raiseGo" class="btn primary wide"></button>
</div>

<div id="settingsSheet" class="sheet">
  <div class="grab"></div>
  <div class="set-row"><span>Amounts</span><div class="seg" data-key="unit"><button data-v="bb">Big blinds</button><button data-v="chips">Chips</button></div></div>
  <div class="set-row"><span>Coach</span><div class="seg" data-key="coach"><button data-v="always">Always</button><button data-v="after">After I act</button><button data-v="off">Off</button></div></div>
  <div class="set-row"><span>Stacks</span><div class="seg" data-key="stacks"><button data-v="topup">Top up</button><button data-v="carry">Carry over</button><button data-v="reset">Reset</button></div></div>
  <div class="set-row"><span>Deck</span><div class="seg" data-key="fourColor"><button data-v="false">2-color</button><button data-v="true">4-color</button></div></div>
  <div class="set-row"><span>Players</span><div class="seg" data-key="seats"><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button></div></div>
  <div class="set-row"><span>Speed</span><div class="seg" data-key="speed"><button data-v="slow">Relaxed</button><button data-v="normal">Normal</button><button data-v="fast">Fast</button></div></div>
  <div class="set-row"><span>Table</span><div class="seg" data-key="felt"><button data-v="black">Black</button><button data-v="green">Green</button><button data-v="navy">Navy</button></div></div>
  <div class="set-row"><span>Orbit review</span><div class="seg" data-key="orbitReview"><button data-v="true">On</button><button data-v="false">Off</button></div></div>
  <div class="set-row"><span>Calibration</span><div class="seg" data-key="calibration"><button data-v="true">On</button><button data-v="false">Off</button></div></div>
  <div class="set-row stats"><span id="sessionStats"></span></div>
  <button id="newTable" class="btn wide">New table</button>
</div>

<button id="analysisBtn" class="an-btn">Analysis</button>
<script type="module" src="js/app.js"></script>
</body>
</html>
